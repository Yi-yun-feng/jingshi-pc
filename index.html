<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>净式 JingShi</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="app-header">
        <h1>净式</h1>
        <span class="app-sub">专业符号 → 聊天可读纯文本</span>
      </header>

      <section class="panes">
        <div class="pane">
          <div class="pane-head">
            <label for="input">原文（LaTeX / Markdown）</label>
            <button id="clear" class="ghost" type="button">清空</button>
          </div>
          <textarea id="input" spellcheck="false" placeholder="粘贴公式或聊天文本，例如：$\frac{a}{b}$ 与 $E = mc^2$"></textarea>
        </div>

        <div class="pane">
          <div class="pane-head">
            <label for="output">结果</label>
            <button id="copy" type="button">复制</button>
          </div>
          <textarea id="output" readonly placeholder="转换结果会显示在这里"></textarea>
        </div>
      </section>

      <footer class="app-footer">
        <span>转换发生在本地，内容不会上传。</span>
      </footer>
    </main>
  </body>
</html>
